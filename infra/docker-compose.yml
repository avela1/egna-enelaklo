# Local development services for egna-enelaklo.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# PostgreSQL  database          localhost:5432
# SeaweedFS   S3 API            localhost:9000
# Mailpit     SMTP / web UI     localhost:1025   (UI on 8025)
#
# The bucket is PRIVATE: objects are only reachable through short lived
# signed URLs that the API hands out.
#
# The S3-compatible storage runs behind the "storage" profile so that a
# registry which cannot reach the image does not block the rest of the stack:
#
#   docker compose -f infra/docker-compose.yml --profile storage up -d
#
# MinIO itself is not used any more: its community edition was archived
# upstream and its images are no longer pullable (Docker Hub access denied,
# dl.min.io returns 410). SeaweedFS is S3-compatible and works with the same
# bucket and key layout. Decision record: docs/decisions.
#
# POSTGRES_HOST_PORT lets you move the database off 5432 when the host already
# runs a PostgreSQL (set it in the root .env, then use the same port in
# DATABASE_URL in apps/api/.env).

name: egna-enelaklo

services:
  postgres:
    image: postgres:16-alpine
    container_name: egna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: egna
      POSTGRES_PASSWORD: egna
      POSTGRES_DB: egna_dev
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - egna-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U egna -d egna_dev']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # S3-compatible storage for the private bucket. In dev it accepts any
  # access key, so the egna / egna-secret pair in apps/api/.env still works.
  storage:
    image: chrislusf/seaweedfs:latest
    container_name: egna-storage
    restart: unless-stopped
    profiles: ['storage']
    command: server -dir /data -master.volumeSizeLimitMB=10240 -s3 -s3.port=9000 -ip.bind=0.0.0.0
    ports:
      - '9000:9000'
      - '9333:9333'
    volumes:
      - egna-minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: egna-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  egna-postgres-data:
  egna-minio-data:

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: egna
          POSTGRES_PASSWORD: egna
          POSTGRES_DB: egna_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egna -d egna_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://egna:egna@localhost:5432/egna_dev?schema=public
      WEB_ORIGIN: http://localhost:5173
      WEB_URL: http://localhost:5173
      LOG_LEVEL: warn
      SEED_PASSWORD: ci-only-seed-password-0000
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build design tokens
        run: npm run tokens:build

      - name: Apply the migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
